<VirtualHost *:80>
    ServerAdmin you@example.net
    DocumentRoot /opt/openDCIM/opendcim
    ServerName opendcim.local

    AllowEncodedSlashes On

    AddType image/svg+xml .svg .svgz
    <FilesMatch "\.svg$">
        Header set Content-Type "image/svg+xml"
        Header always set X-Content-Type-Options "nosniff"
    </FilesMatch>

    <LocationMatch "^/assets/">
        Header always set Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'none'; script-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none';"
    </LocationMatch>

    <Directory "/opt/openDCIM">
        AllowOverride None
        Options Indexes FollowSymLinks
        Require all granted
    </Directory>

    <Directory /opt/openDCIM/opendcim>
        AllowOverride All
        AuthType Basic
        AuthName "openDCIM"
        AuthUserFile /opt/openDCIM/opendcim/.htpasswd
        Require valid-user
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/opendcim_error.log
    CustomLog ${APACHE_LOG_DIR}/opendcim_access.log combined
</VirtualHost>

